name: CmdTab
options:
  bundleIdPrefix: dev.mani
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CmdTab:
    type: application
    platform: macOS
    sources: [CmdTab]
    info:
      path: CmdTab/Info.plist
      properties:
        CFBundleName: CmdTab
        CFBundleDisplayName: CmdTab
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mani.CmdTab
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
